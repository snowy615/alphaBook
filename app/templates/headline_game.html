<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaBook — Headline Game</title>
    <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>

</head>

<body>
    <div class="topbar">
        <div class="brand">
            <a href="/" class="brand-link">
                <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
                <div class="titles">
                    <h1>AlphaBook</h1>
                    <div class="subtitle">Headline Trading</div>
                </div>
            </a>
        </div>
        <div id="userBox" class="actions"><a href="/profile" class="btn ghost">Profile</a><span id="userName"></span></div>
    </div>

    <div class="page-container" style="max-width: 960px;">
        <div id="gameArea">
            <div class="hl-loading">Loading game...</div>
        </div>
    </div>

    <script>
        window.GAME_ID = "{{ game_id }}";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="/static/feedback.js?v=1"></script>
    <script src="/static/headline.js"></script>
  <script src="/static/tutorial.js"></script>
  <script>
    AlphaTutorial.init({
      key: "headline",
      version: 1,
      title: "Headline Trading",
      label: "How to play",
      fullRulesHref: "/headline",
      steps: [
      { heading: "One contract, five minutes, live news", body: "The price walks continuously. Headlines hit the wire at random times and bias the walk in one direction for a while afterwards.", facts: [["Round length", "5 min"], ["Position range", "−1000 to +1000"]] },
      { heading: "Read the headline, then size it", body: "Set your position at any moment. Not every headline moves the price the same amount — some are strong signals, some are noise dressed up as news." },
      { heading: "P&L is marked continuously", body: "Each change of position is a trade at the price on the screen. Your P&amp;L is the sum of contracts times the move since you got in. At the end, every headline's true strength is revealed." },
      ],
    });
  </script>
</body>

</html>
