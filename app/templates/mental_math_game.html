<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Math Game - {{ app_name }}</title>
    <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>

</head>

<body>
    <div class="topbar">
        <div class="brand">
            <a href="/" class="brand-link">
                <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
                <div class="titles">
                    <h1>{{ app_name }}</h1>
                    <div class="subtitle">Mental Math</div>
                </div>
            </a>
        </div>
        <div class="actions">
            <a href="/profile" class="btn ghost">Profile</a>
            <span id="userName">user</span>
            <form method="post" action="/logout" style="display:inline"><button type="submit"
                    class="btn ghost">Logout</button></form>
        </div>
    </div>

    <div class="container">
        <div id="gameArea">
            <div class="mm-loading">Loading game...</div>
        </div>
    </div>

    <div class="footer">
        <p>{{ app_name }} • Mental Math</p>
    </div>

    <script>
        window.GAME_ID = "{{ game_id }}";
    </script>
    <script src="/static/feedback.js?v=1"></script>
    <script src="/static/mental_math.js"></script>
  <script src="/static/tutorial.js"></script>
  <script>
    AlphaTutorial.init({
      key: "mental-math",
      version: 1,
      title: "Mental Math",
      label: "How to play",
      fullRulesHref: "/mental-math",
      steps: [
      { heading: "Arithmetic against a clock", body: "Questions come one at a time with a timer. The host sets the types, the difficulty, how many questions and how long you get for each." },
      { heading: "Answer or lose it", body: "One point per correct answer. If the timer runs out the question is skipped and scores nothing, so a fast wrong answer costs you no more than running out — commit and move on." },
      { heading: "Most correct answers wins", body: "Your running score and the leaderboard update as you go. There is a full review of every question at the end." },
      ],
    });
  </script>
</body>

</html>
