<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Admin Login · AlphaBook</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>

</head>

<body class="auth-body">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
            <div class="titles">
                <h1>AlphaBook</h1>
                <div class="subtitle">Control panel</div>
            </div>
        </div>
        {% if error %}<div class="err">{{ error }}</div>{% endif %}
        <form method="post" action="/admin/login">
            <label>Username</label>
            <input name="username" type="text" required placeholder="admin" autofocus />
            <label>Password</label>
            <input name="password" type="password" required />
            <button type="submit" class="btn primary auth-submit">Sign in as admin</button>
        </form>
        <div class="auth-alt"><a href="/login">← Back to regular login</a></div>
    </div>
</body>

</html>
