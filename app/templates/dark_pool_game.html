<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Pool - {{ app_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>
</head>

<body>
  <div class="topbar">
    <div class="brand">
      <a href="/" class="brand-link">
        <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
        <div class="titles">
          <h1>{{ app_name }}</h1>
          <div class="subtitle">Dark Pool</div>
        </div>
      </a>
    </div>
    <div class="actions">
      <a href="/leaderboard" class="btn ghost">Leaderboard</a>
      <a href="/profile" class="btn ghost">Profile</a>
      <span id="userName">user</span>
    </div>
  </div>

  <div class="container">
    <div id="msg" class="msp-msg hidden"></div>
    <div id="gameArea">Loading desk...</div>
  </div>

  <script>
    window.GAME_ID = "{{ game_id }}";
  </script>
  <script src="/static/feedback.js?v=1"></script>
  <script src="/static/dark_pool.js?v=1"></script>
</body>

</html>
