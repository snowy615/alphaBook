<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} — Poker Auction</title>
    <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>

</head>

<body>
    <div class="topbar">
        <div class="brand">
            <a href="/" class="brand-link">
                <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
                <div class="titles">
                    <h1>AlphaBook</h1>
                    <div class="subtitle">Poker Auction</div>
                </div>
            </a>
        </div>
        <div id="userBox" class="actions"><a href="/profile" class="btn ghost">Profile</a><span id="userName"></span></div>
    </div>

    <div class="page-container" style="max-width: 960px;">
        <div id="gameArea" class="pa-loading">Loading game...</div>
    </div>

    <script>
        window.GAME_ID = "{{ game_id }}";
    </script>
    <script src="/static/feedback.js?v=1"></script>
    <script src="/static/poker_auction.js"></script>
  <script src="/static/tutorial.js"></script>
  <script>
    AlphaTutorial.init({
      key: "poker-auction",
      version: 1,
      title: "Poker Auction",
      label: "How to play",
      fullRulesHref: "/poker-auction",
      steps: [
      { heading: "Buy cards, build a hand", body: "Your team starts with one random card and $1,000. Thirteen rounds of sealed-bid auction put the whole deck up for sale.", facts: [["Starting cash", "$1,000"], ["Rounds", "13"]] },
      { heading: "Second-price, so bid your value", body: "The highest bidder wins the cards but pays the <strong>second-highest</strong> bid. That means shading your bid down mostly costs you cards you wanted — bid what the cards are actually worth to you." },
      { heading: "Then clear your leftovers", body: "After the auctions you can sell unwanted cards to the host at $20 each, or list them to other teams for a listing fee. Cards you cannot use are still worth something." },
      { heading: "The hand pays the bonus", body: "Your best five-card hand earns a fixed bonus — a pair is $100, a flush $1,500, four of a kind $3,000. The top hand in the room takes another $2,000.", facts: [["Top hand bonus", "$2,000"]] },
      ],
    });
  </script>
</body>

</html>
