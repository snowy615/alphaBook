<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply — {{ app_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
  <script src="/static/theme.js"></script>
  <style>
    /* ── Application flow ────────────────────────────────────────────────── */
    .apl-steps {
      display: flex; gap: 0; margin: 0 0 22px; list-style: none; padding: 0;
      border: 1px solid var(--border); background: var(--card);
    }
    .apl-steps li {
      flex: 1; padding: 12px 14px; font-size: 13px; font-weight: 600;
      color: var(--muted); border-right: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .apl-steps li:last-child { border-right: none; }
    .apl-steps li .apl-n {
      width: 21px; height: 21px; flex: none; display: inline-flex;
      align-items: center; justify-content: center; font-size: 12px;
      border: 1px solid var(--border); color: var(--muted);
    }
    .apl-steps li.is-now { color: var(--text); }
    .apl-steps li.is-now .apl-n { border-color: var(--brand); color: var(--brand); }
    .apl-steps li.is-done { color: var(--green); }
    .apl-steps li.is-done .apl-n { border-color: var(--green); color: var(--green); }
    /* A stage the pipeline never reached — e.g. rejected without ever being
       shortlisted. Muted rather than hidden, so the shape of the process
       still reads even when a step was skipped. */
    .apl-steps li.is-skipped { color: var(--muted); opacity: 0.55; }
    .apl-steps li.is-skipped .apl-n { border-style: dashed; }

    /* ── Interview scheduling (candidate side) ───────────────────────────── */
    .apl-interview {
      border: 1px solid var(--border); padding: 16px 18px; margin: 4px 0 0;
      font-size: 14px; line-height: 1.6;
    }
    .apl-interview p:first-child { margin-top: 0; }
    .apl-interview p:last-child { margin-bottom: 0; }
    .apl-interview.is-confirmed { border-color: var(--green); }
    .apl-interview.is-declined { border-color: var(--border); }
    .apl-interview-note {
      color: var(--muted); font-style: italic; border-left: 2px solid var(--border);
      padding-left: 12px; margin: 12px 0;
    }
    .apl-interview-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }

    .apl-category {
      font-size: 13px; color: var(--muted); background: var(--bg);
      border: 1px solid var(--border); border-left: 3px solid var(--brand);
      padding: 10px 14px; margin: 0 0 18px;
    }
    .apl-category strong { color: var(--text); }

    .apl-choice {
      display: block; border: 1px solid var(--border); background: var(--bg);
      padding: 16px 18px; margin-bottom: 10px; cursor: pointer;
    }
    .apl-choice:hover { border-color: var(--brand); }
    .apl-choice.is-picked { border-color: var(--brand); background: rgba(108, 92, 231, 0.06); }
    .apl-choice input { margin-right: 10px; }
    .apl-choice strong { font-size: 15px; }
    .apl-choice .apl-blurb {
      display: block; margin: 6px 0 0 26px; font-size: 13px; color: var(--muted);
    }
    .apl-choice.is-disabled { cursor: not-allowed; opacity: 0.55; }
    .apl-choice.is-disabled:hover { border-color: var(--border); }
    .apl-soon {
      display: block; margin: 8px 0 0 26px; font-size: 12px;
      color: var(--muted); font-style: italic;
    }

    .apl-rules { margin: 0 0 18px; padding-left: 20px; font-size: 14px; line-height: 1.75; }
    .apl-rules li::marker { color: var(--muted); }

    .apl-warn {
      border: 1px solid var(--red); background: rgba(255, 107, 107, 0.08);
      padding: 14px 16px; margin: 0 0 18px; font-size: 14px; line-height: 1.6;
    }
    .apl-warn strong { color: var(--red); display: block; margin-bottom: 4px; }

    .apl-ack {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 14px; margin: 0 0 16px; cursor: pointer;
    }
    .apl-ack input { margin-top: 3px; flex: none; }

    /* Clocks. Each question has its own; beside it, which part this is. */
    .apl-clocks {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 16px; margin-bottom: 14px;
    }
    .apl-clock-main {
      font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .apl-clock-main.is-low { color: var(--red); }
    .apl-clock-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .apl-progress {
      height: 3px; background: var(--border); margin: 0 0 18px; overflow: hidden;
    }
    .apl-progress span {
      display: block; height: 100%; background: var(--brand);
      transition: width 0.25s linear;
    }
    .apl-progress span.is-low { background: var(--red); }

    .apl-essay-layout { display: flex; gap: 16px; align-items: flex-start; }
    .apl-essay-col { flex: 1 1 auto; min-width: 0; }

    .apl-essay {
      width: 100%; min-height: 260px; resize: vertical; padding: 14px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font: inherit; font-size: 15px; line-height: 1.6; box-sizing: border-box;
    }
    .apl-essay:focus { outline: none; border-color: var(--brand); }
    .apl-essay-meta {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      font-size: 12px; color: var(--muted); margin-top: 8px;
    }
    .apl-preview-btn { font-size: 12px; padding: 5px 10px; }
    .apl-preview {
      margin-top: 10px; padding: 14px; border: 1px dashed var(--border);
      background: var(--bg); font-size: 15px; line-height: 1.6; white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .apl-preview .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
    .apl-preview .katex { overflow-wrap: normal; }
    .apl-preview code, .apl-hint code {
      font-size: 12px; background: var(--card); padding: 1px 5px; border: 1px solid var(--border);
    }

    /* ── LaTeX reference sheet (estimation question only) ─────────────────── */
    .apl-latex-ref {
      flex: 0 0 280px; width: 280px; box-sizing: border-box; padding: 14px;
      border: 1px solid var(--border); background: var(--panel);
      font-size: 12.5px; line-height: 1.6; max-height: 340px; overflow-y: auto;
    }
    .apl-latex-ref h4 {
      margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted);
    }
    .apl-latex-row { padding: 6px 0; border-bottom: 1px solid var(--border); }
    .apl-latex-row:last-child { border-bottom: none; }
    .apl-latex-label { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
    .apl-latex-code-line {
      display: flex; justify-content: space-between; align-items: baseline;
      flex-wrap: wrap; gap: 4px 10px;
    }
    .apl-latex-eg { color: var(--text); }
    @media (max-width: 640px) {
      .apl-essay-layout { flex-direction: column; }
      .apl-latex-ref { width: 100%; flex-basis: auto; max-height: 220px; }
    }

    .apl-q-prompt { font-size: 18px; line-height: 1.5; margin: 0 0 18px; }
    .apl-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

    .field-group label {
      display: block; font-size: 13px; font-weight: 600;
      color: var(--muted); margin-bottom: 7px;
    }
    .field-group input, .field-group select {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 15px; box-sizing: border-box;
      font-family: inherit;
    }
    .field-group input:focus, .field-group select:focus { outline: none; border-color: var(--brand); }

    .apl-done-tick {
      font-size: 34px; color: var(--green); line-height: 1; margin-bottom: 10px;
    }

    /* ── Interview availability grid ─────────────────────────────────────── */
    .aval-wrap {
      overflow: auto; max-height: 460px; margin: 4px 0 10px;
      border: 1px solid var(--border); border-radius: 8px;
    }
    .aval-grid { border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 12px; }
    .aval-grid th, .aval-grid td { border: 1px solid var(--border); padding: 0; text-align: center; width: 46px; }
    .aval-grid thead th {
      padding: 9px 2px; font-weight: 600; color: var(--muted); font-size: 11px;
      white-space: nowrap; background: var(--bg); position: sticky; top: 0; z-index: 1;
    }
    .aval-daylabel {
      width: 100px !important; padding: 0 12px !important; text-align: left !important;
      white-space: nowrap; font-weight: 600; font-size: 12.5px; background: var(--bg);
      position: sticky; left: 0; z-index: 2;
    }
    .aval-cell-btn {
      width: 100%; height: 32px; border: none; background: var(--card);
      cursor: pointer; display: block; padding: 0; margin: 0; box-sizing: border-box;
      transition: background .12s ease;
    }
    .aval-cell-btn:hover { background: var(--brand-wash); }
    .aval-cell-btn.is-selected { background: var(--green); }
    .aval-cell-btn:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
    .aval-locked-note {
      font-size: 13px; color: var(--muted); border: 1px dashed var(--border);
      padding: 12px 14px; margin: 4px 0 10px;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="brand">
      <a href="/" class="brand-link">
        <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
        <div class="titles">
          <h1>{{ app_name }}</h1>
          <div class="subtitle">Apply to Alpha Fund</div>
        </div>
      </a>
    </div>
    <div class="actions">
      <a href="/profile" class="btn ghost" id="profileLink">Profile</a>
      <span id="userName">user</span>
    </div>
  </div>

  <div class="container" style="max-width: 720px;">
    <div id="msg" class="msp-msg hidden"></div>
    <div id="steps"></div>
    <div id="app">Loading…</div>
  </div>

  <script>
    window.APPLY = {
      motivationMinutes: {{ motivation_minutes }},
      estimationMinutes: {{ estimation_minutes }},
      sessionMinutes: {{ session_minutes }},
    };
  </script>
  <script src="/static/availability.js"></script>
  <script src="/static/apply.js?v=2"></script>
</body>

</html>
