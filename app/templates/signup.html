<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Sign up · AlphaBook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>

</head>

<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
      <div class="titles">
        <h1>AlphaBook</h1>
        <div class="subtitle">Create your account</div>
      </div>
    </div>
    {% if error %}<div class="err">{{error}}</div>{% endif %}

    <button type="button" id="googleBtn" class="auth-google">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">or</div>

    <div id="auth-container">
      <form id="signup-form">
        <label>Email</label>
        <input name="email" type="email" required placeholder="name@example.com" />
        <label>Username</label>
        <input name="username" type="text" required placeholder="Display name" />
        <label>Password</label>
        <input name="password" type="password" required minlength="6" />
        <button type="submit" class="btn primary auth-submit">Sign up</button>
      </form>
      <div id="signup-info" class="info" style="display:none;"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
      import {
        getAuth, createUserWithEmailAndPassword,
        GoogleAuthProvider, signInWithPopup,
      } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

      async function init() {
        try {
          const res = await fetch("/auth/config", { credentials: "include" });
          const firebaseConfig = await res.json();
          if (!firebaseConfig.apiKey) {
            console.error("Firebase config missing");
            alert("System Error: Firebase configuration not found.");
            return;
          }

          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);

          // Send the Firebase-verified id token to the backend, which finds
          // or creates the matching AlphaBook account. `preferredUsername` is
          // best-effort: if it collides (rare — only possible on someone's
          // very first sign-in with that email) we retry once with a
          // random suffix rather than surfacing a username form nobody asked
          // to fill in.
          async function syncBackend(user, preferredUsername) {
            const token = await user.getIdToken();
            const attempt = async (username) => {
              const formData = new FormData();
              formData.append('id_token', token);
              if (username) formData.append('username', username);
              return fetch("/auth/firebase", { method: "POST", body: formData, credentials: "include" });
            };

            let res = await attempt(preferredUsername);
            if (!res.ok) {
              const err = await res.json().catch(() => ({}));
              if (res.status === 400 && /taken/i.test(err.message || "") && preferredUsername) {
                res = await attempt(preferredUsername + Math.floor(1000 + Math.random() * 9000));
              }
              if (!res.ok) {
                const err2 = await res.json().catch(() => ({}));
                throw new Error(err2.message || err2.detail || "Account sync failed");
              }
            }
            return res;
          }

          // ── Email + password ────────────────────────────────────────────
          const form = document.getElementById('signup-form');
          const info = document.getElementById('signup-info');
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = form.email.value;
            const username = form.username.value;
            const password = form.password.value;
            const btn = form.querySelector('button');
            btn.disabled = true;
            btn.innerText = "Creating account...";

            try {
              const userCredential = await createUserWithEmailAndPassword(auth, email, password);
              const user = userCredential.user;

              // The verification email itself is sent server-side, from
              // /auth/firebase below, once the account actually exists —
              // branded like every other AlphaBook email rather than
              // Firebase's generic default template.
              await syncBackend(user, username);

              info.textContent = "Account created — check your inbox to verify " + email + ". Taking you in…";
              info.style.display = "block";
              setTimeout(() => { window.location.href = "/welcome"; }, 1400);
            } catch (error) {
              console.error(error);
              alert("Signup Error: " + error.message);
              btn.disabled = false;
              btn.innerText = "Sign up";
            }
          });

          // ── Google ───────────────────────────────────────────────────────
          const googleBtn = document.getElementById('googleBtn');
          const googleBtnDefault = googleBtn.innerHTML;
          const provider = new GoogleAuthProvider();
          googleBtn.addEventListener('click', async () => {
            googleBtn.disabled = true;
            googleBtn.textContent = "Connecting…";
            try {
              const cred = await signInWithPopup(auth, provider);
              const user = cred.user;
              // Google already verifies the address, so there's no separate
              // verification email to send here.
              await syncBackend(user, (user.displayName || "").replace(/\s+/g, "").toLowerCase() || undefined);
              window.location.href = "/welcome";
            } catch (error) {
              console.error(error);
              if (error.code !== "auth/popup-closed-by-user" && error.code !== "auth/cancelled-popup-request") {
                alert("Google sign-in error: " + error.message);
              }
              googleBtn.disabled = false;
              googleBtn.innerHTML = googleBtnDefault;
            }
          });
        } catch (e) {
          console.error("Auth init error", e);
        }
      }
      init();
    </script>
    <div class="auth-alt">Already have an account? <a href="/login">Sign in</a></div>
  </div>
</body>

</html>
