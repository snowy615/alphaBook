<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Sign up · AlphaBook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>

</head>

<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
      <div class="titles">
        <h1>AlphaBook</h1>
        <div class="subtitle">Create your account</div>
      </div>
    </div>
    {% if error %}<div class="err">{{error}}</div>{% endif %}
    <div id="auth-container">
      <form id="signup-form">
        <label>Email</label>
        <input name="email" type="email" required placeholder="name@example.com" />
        <label>Username</label>
        <input name="username" type="text" required placeholder="Display name" />
        <label>Password</label>
        <input name="password" type="password" required minlength="6" />
        <button type="submit" class="btn primary auth-submit">Sign up</button>
      </form>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

      async function init() {
        try {
          const res = await fetch("/auth/config", { credentials: "include" });
          const firebaseConfig = await res.json();
          if (!firebaseConfig.apiKey) {
            console.error("Firebase config missing");
            alert("System Error: Firebase configuration not found.");
            return;
          }

          const app = initializeApp(firebaseConfig);
          const auth = getAuth(app);

          const form = document.getElementById('signup-form');
          form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = form.email.value;
            const username = form.username.value;
            const password = form.password.value;
            const btn = form.querySelector('button');
            btn.disabled = true;
            btn.innerText = "Creating account...";

            try {
              // 1. Create user in Firebase
              const userCredential = await createUserWithEmailAndPassword(auth, email, password);
              const user = userCredential.user;

              // 2. Update profile with display name (optional but good practice)
              // await updateProfile(user, { displayName: username });

              // 3. Get token
              const token = await user.getIdToken();

              // 4. Send token + username to backend
              const formData = new FormData();
              formData.append('id_token', token);
              formData.append('username', username);

              const loginRes = await fetch("/auth/firebase", {
                method: "POST",
                body: formData,
                credentials: "include"
              });

              if (loginRes.ok) {
                // New accounts go to placement so they get a path, not a menu.
                window.location.href = "/welcome";
              } else {
                const err = await loginRes.json();
                alert("Account created but backend sync failed: " + (err.message || err.detail || "Unknown error"));
                // Potentially delete firebase user if sync fails? Or handle on next login.
                btn.disabled = false;
                btn.innerText = "Sign up";
              }
            } catch (error) {
              console.error(error);
              alert("Signup Error: " + error.message);
              btn.disabled = false;
              btn.innerText = "Sign up";
            }
          });
        } catch (e) {
          console.error("Auth init error", e);
        }
      }
      init();
    </script>
    <div class="auth-alt">Already have an account? <a href="/login">Sign in</a></div>
  </div>
</body>

</html>
