<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Login · AlphaBook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>

</head>

<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
      <div class="titles">
        <h1>AlphaBook</h1>
        <div class="subtitle">Sign in to trade</div>
      </div>
    </div>
    {% if error %}<div class="err">{{error}}</div>{% endif %}
    <div id="auth-container">
      <form id="login-form">
        <label>Email or username</label>
        <input name="identifier" type="text" required placeholder="name@example.com or username" autofocus />
        <label>Password</label>
        <input name="password" type="password" required />
        <button type="submit" class="btn primary auth-submit">Sign in</button>
      </form>
      <div id="login-error" class="err" style="display:none;"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

      async function init() {
        let firebaseAuth = null;

        // Try loading Firebase config (may fail on network issues, that's ok for direct login)
        try {
          const res = await fetch("/auth/config", { credentials: "include" });
          const firebaseConfig = await res.json();
          if (firebaseConfig.apiKey) {
            const app = initializeApp(firebaseConfig);
            firebaseAuth = getAuth(app);
          }
        } catch (e) {
          console.warn("Firebase config not available, only direct login will work", e);
        }

        const form = document.getElementById('login-form');
        const errDiv = document.getElementById('login-error');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const identifier = form.identifier.value.trim();
          const password = form.password.value;
          const btn = form.querySelector('button');
          btn.disabled = true;
          btn.innerText = "Signing in...";
          errDiv.style.display = "none";

          const isEmail = identifier.includes("@");

          if (!isEmail) {
            // --- Direct login (username + password) ---
            try {
              const formData = new FormData();
              formData.append("username", identifier);
              formData.append("password", password);

              const res = await fetch("/auth/direct", {
                method: "POST",
                body: formData,
                credentials: "include"
              });

              if (res.ok) {
                window.location.href = "/";
                return;
              } else {
                const data = await res.json();
                errDiv.textContent = data.message || "Invalid credentials";
                errDiv.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Sign in";
              }
            } catch (err) {
              errDiv.textContent = "Network error: " + err.message;
              errDiv.style.display = "block";
              btn.disabled = false;
              btn.innerText = "Sign in";
            }
          } else {
            // --- Firebase email login ---
            if (!firebaseAuth) {
              errDiv.textContent = "Firebase not configured. Email login unavailable.";
              errDiv.style.display = "block";
              btn.disabled = false;
              btn.innerText = "Sign in";
              return;
            }

            try {
              const userCredential = await signInWithEmailAndPassword(firebaseAuth, identifier, password);
              const token = await userCredential.user.getIdToken();

              const formData = new FormData();
              formData.append('id_token', token);

              const loginRes = await fetch("/auth/firebase", {
                method: "POST",
                body: formData,
                credentials: "include"
              });

              if (loginRes.ok) {
                window.location.href = "/";
              } else {
                const err = await loginRes.json();
                errDiv.textContent = err.message || err.detail || "Login failed";
                errDiv.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Sign in";
              }
            } catch (error) {
              console.error(error);
              errDiv.textContent = error.message;
              errDiv.style.display = "block";
              btn.disabled = false;
              btn.innerText = "Sign in";
            }
          }
        });
      }
      init();
    </script>
    <div class="auth-alt">No account? <a href="/signup">Create one</a></div>
  </div>
</body>

</html>
