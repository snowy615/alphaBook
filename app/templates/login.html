<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Login · AlphaBook</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/theme.js"></script>

</head>

<body class="auth-body">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="logo"><img src="/static/alphabook.png" alt="AlphaBook" class="logo-img"></div>
      <div class="titles">
        <h1>AlphaBook</h1>
        <div class="subtitle">Sign in to trade</div>
      </div>
    </div>
    {% if error %}<div class="err">{{error}}</div>{% endif %}

    <button type="button" id="googleBtn" class="auth-google">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.56 2.7-3.87 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <div class="auth-divider">or</div>

    <div id="auth-container">
      <form id="login-form">
        <label>Email or username</label>
        <input name="identifier" type="text" required placeholder="name@example.com or username" autofocus />
        <label>Password</label>
        <input name="password" type="password" required />
        <button type="submit" class="btn primary auth-submit">Sign in</button>
      </form>
      <div id="login-error" class="err" style="display:none;"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
      import {
        getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup,
      } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
      import { showVerificationNeeded } from "/static/verify_email.js";

      async function init() {
        let firebaseAuth = null;

        // Try loading Firebase config (may fail on network issues, that's ok for direct login)
        try {
          const res = await fetch("/auth/config", { credentials: "include" });
          const firebaseConfig = await res.json();
          if (firebaseConfig.apiKey) {
            const app = initializeApp(firebaseConfig);
            firebaseAuth = getAuth(app);
          }
        } catch (e) {
          console.warn("Firebase config not available, only direct login will work", e);
        }

        const form = document.getElementById('login-form');
        const errDiv = document.getElementById('login-error');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          let identifier = form.identifier.value.trim();
          const password = form.password.value;
          const btn = form.querySelector('button');
          btn.disabled = true;
          btn.innerText = "Signing in...";
          errDiv.style.display = "none";

          if (!identifier.includes("@")) {
            // Firebase signs in by email, not username — resolve the typed
            // username to its email first, so this goes through the same
            // Firebase flow as an email-typed login. A resolution failure
            // isn't fatal: it just falls through to the direct-login branch
            // below, which is how the local admin account still gets in.
            try {
              const formData = new FormData();
              formData.append("username", identifier);
              const res = await fetch("/auth/resolve-username", { method: "POST", body: formData, credentials: "include" });
              if (res.ok) {
                identifier = (await res.json()).email;
              }
            } catch (err) { /* fall through to direct login */ }
          }

          const isEmail = identifier.includes("@");

          if (!isEmail) {
            // --- Direct login (admin username + password) ---
            try {
              const formData = new FormData();
              formData.append("username", identifier);
              formData.append("password", password);

              const res = await fetch("/auth/direct", {
                method: "POST",
                body: formData,
                credentials: "include"
              });

              if (res.ok) {
                window.location.href = "/";
                return;
              } else {
                const data = await res.json();
                errDiv.textContent = data.message || "Invalid credentials";
                errDiv.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Sign in";
              }
            } catch (err) {
              errDiv.textContent = "Network error: " + err.message;
              errDiv.style.display = "block";
              btn.disabled = false;
              btn.innerText = "Sign in";
            }
          } else {
            // --- Firebase email login ---
            if (!firebaseAuth) {
              errDiv.textContent = "Firebase not configured. Email login unavailable.";
              errDiv.style.display = "block";
              btn.disabled = false;
              btn.innerText = "Sign in";
              return;
            }

            try {
              const user = (await signInWithEmailAndPassword(firebaseAuth, identifier, password)).user;

              const postToken = async (forceRefresh) => {
                const token = await user.getIdToken(forceRefresh);
                const formData = new FormData();
                formData.append('id_token', token);
                const res = await fetch("/auth/firebase", { method: "POST", body: formData, credentials: "include" });
                const data = await res.json().catch(() => ({}));
                return { res, data };
              };

              let { res: loginRes, data } = await postToken(false);

              if (loginRes.ok && data.status === "ok") {
                window.location.href = "/";
              } else if (data.status === "unverified") {
                await showVerificationNeeded({ user, email: identifier });
                ({ res: loginRes } = await postToken(true)); // fresh token now carries email_verified
                if (loginRes.ok) {
                  window.location.href = "/";
                } else {
                  errDiv.textContent = "Something went wrong — please sign in again.";
                  errDiv.style.display = "block";
                  btn.disabled = false;
                  btn.innerText = "Sign in";
                }
              } else {
                errDiv.textContent = data.message || data.detail || "Login failed";
                errDiv.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Sign in";
              }
            } catch (error) {
              console.error(error);
              errDiv.textContent = error.message;
              errDiv.style.display = "block";
              btn.disabled = false;
              btn.innerText = "Sign in";
            }
          }
        });

        // ── Google ─────────────────────────────────────────────────────────
        const googleBtn = document.getElementById('googleBtn');
        if (!firebaseAuth) {
          googleBtn.disabled = true;
          googleBtn.title = "Firebase not configured";
        } else {
          const googleBtnDefault = googleBtn.innerHTML;
          const provider = new GoogleAuthProvider();
          googleBtn.addEventListener('click', async () => {
            googleBtn.disabled = true;
            googleBtn.textContent = "Connecting…";
            errDiv.style.display = "none";
            try {
              const cred = await signInWithPopup(firebaseAuth, provider);
              const token = await cred.user.getIdToken();

              // An existing account is found by firebase_uid regardless of
              // username, so this same call covers a returning user and a
              // first-time Google sign-up. For a first-time sign-up the
              // backend derives a username from the email if none is given;
              // on the rare collision, retry once with a random suffix
              // rather than surfacing a username form nobody asked to fill.
              const attempt = async (username) => {
                const formData = new FormData();
                formData.append('id_token', token);
                if (username) formData.append('username', username);
                return fetch("/auth/firebase", { method: "POST", body: formData, credentials: "include" });
              };

              let loginRes = await attempt();
              if (!loginRes.ok) {
                const err = await loginRes.json().catch(() => ({}));
                if (loginRes.status === 400 && /taken/i.test(err.message || "")) {
                  const base = (cred.user.email || "user").split("@")[0].replace(/[^a-z0-9]/gi, "");
                  loginRes = await attempt(base + Math.floor(1000 + Math.random() * 9000));
                }
              }

              if (loginRes.ok) {
                window.location.href = "/";
              } else {
                const err2 = await loginRes.json().catch(() => ({}));
                errDiv.textContent = err2.message || err2.detail || "Google sign-in failed";
                errDiv.style.display = "block";
                googleBtn.disabled = false;
                googleBtn.innerHTML = googleBtnDefault;
              }
            } catch (error) {
              console.error(error);
              if (error.code !== "auth/popup-closed-by-user" && error.code !== "auth/cancelled-popup-request") {
                errDiv.textContent = error.message;
                errDiv.style.display = "block";
              }
              googleBtn.disabled = false;
              googleBtn.innerHTML = googleBtnDefault;
            }
          });
        }
      }
      init();
    </script>
    <div class="auth-alt">No account? <a href="/signup">Create one</a></div>
  </div>
</body>
</html>
