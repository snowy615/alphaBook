name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The whole suite runs in a few seconds. The old hang on most pushes was
    # an infinite loop in tests/test_algo_engine.py, triggered by float error
    # on a freshly booted runner's small time.monotonic(); fixed in
    # algo_engine.advance(). The cap stays so any future hang costs minutes.
    timeout-minutes: 10

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app/

      - name: Run tests
        # A test stuck for 60s dumps every thread's stack to the log, so a
        # hang names its line instead of dying silently at the job timeout.
        run: python -m pytest tests/ -v -o faulthandler_timeout=60
