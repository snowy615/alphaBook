name: Deploy to Cloud Run + Firebase

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Every real run has completed in ~4 minutes; capped generously so a
    # hung Cloud Build or Firebase deploy can't silently run up minutes the
    # way the CI job's dependency install has been doing (see ci.yml).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        run: |
          # max-instances MUST stay 1: the order book and market-maker bot
          # live in instance memory, so multiple instances would each serve
          # a different, conflicting book.
          gcloud run deploy alphabook-api \
            --source . \
            --region us-central1 \
            --allow-unauthenticated \
            --max-instances 1 \
            --quiet

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          channelId: live
          projectId: alphabook-5ef4e
